services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_DB: greencore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data 

  minio:
    image: minio/minio
    restart: always
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data
    volumes:
      - minio-data:/data

  moto:
    image: motoserver/moto:5.1.4
    restart: always
    ports:
      - "5000:5000"

volumes:
  pgdata:
  minio-data:
